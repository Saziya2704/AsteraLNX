version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: asteralnx-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: astera_lnx
      MYSQL_USER: astera
      MYSQL_PASSWORD: asterapass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: asteralnx-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/astera_lnx?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: astera
      SPRING_DATASOURCE_PASSWORD: asterapass
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@asteralnx.com}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      JWT_SECRET: AsteraLNX-Production-Secret-Change-Me-2026-LongEnoughKey
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
