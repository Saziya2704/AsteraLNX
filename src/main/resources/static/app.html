<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsteraLNX — Operations Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body class="app-body">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <a href="#/dashboard" class="sidebar-brand">
      <span class="brand-icon"><i class="bi bi-truck"></i></span>
      AsteraLNX
    </a>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="user-avatar flex-shrink-0" id="userAvatar">A</div>
        <div class="overflow-hidden" style="min-width:0">
          <div class="text-white small fw-semibold text-truncate" id="userName" title="">—</div>
          <div class="text-truncate" id="userRole" style="font-size:.7rem;color:#64748b">—</div>
        </div>
      </div>
      <button class="btn btn-outline-light btn-sm w-100" id="logoutBtn">
        <i class="bi bi-box-arrow-right me-1"></i> Sign out
      </button>
      <div class="mt-2 text-center" style="font-size:.65rem;color:#475569">v1.0 · Internal</div>
    </div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-ghost d-lg-none p-1" id="menuToggle" type="button" aria-label="Open menu"><i class="bi bi-list fs-4"></i></button>
        <button type="button" class="collapse-toggle d-none d-lg-inline-flex" id="sidebarCollapseBtn" title="Collapse menu" aria-label="Collapse sidebar"><i class="bi bi-layout-sidebar-inset"></i></button>
        <div>
          <div class="topbar-title" id="headerTitle">Dashboard</div>
          <nav aria-label="breadcrumb"><ol class="breadcrumb breadcrumb-app mb-0" id="breadcrumb"><li class="breadcrumb-item">Home</li></ol></nav>
        </div>
      </div>
      <div class="d-flex align-items-center gap-2">
        <input type="search" class="form-control form-control-sm topbar-search d-none d-md-block" id="globalNavFilter" placeholder="Filter menu…" aria-label="Filter navigation">
        <span class="badge rounded-pill text-bg-primary" id="headerRoleBadge"></span>
        <div class="user-chip d-none d-md-flex" title="Signed in">
          <span class="user-avatar" id="topAvatar" style="width:28px;height:28px;font-size:.7rem">A</span>
          <span class="small fw-semibold text-truncate" style="max-width:120px" id="topUserName">—</span>
        </div>
      </div>
    </header>
    <main class="page-body" id="pageContent"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
